[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakecontext"
version = "0.4.0"
description = "Evidence-backed Databricks metadata context for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "sqlglot>=26,<30", "mcp>=1.12,<2", "databricks-sdk>=0.60,<1"]

[project.scripts]
lakecontext = "lakecontext.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/lakecontext"]
